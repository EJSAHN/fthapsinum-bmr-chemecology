name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: workflow-tests
          python-version: "3.11"
          channels: conda-forge
          conda-remove-defaults: true
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy statsmodels pyyaml biopython pysam requests pytest "snakemake>=8,<10"
      - name: Record test environment
        run: |
          python --version
          conda --version
          snakemake --version
          python -m pip freeze
      - name: Check Python syntax
        run: python -m compileall -q workflow/scripts tests
      - name: Check shell syntax
        run: |
          for file in workflow/scripts/*.sh; do bash -n "$file"; done
      - name: Run tests
        run: pytest -q
      - name: Parse main workflow
        run: snakemake --dry-run --cores 1
      - name: Parse optional pathogen workflow
        run: snakemake macrophomina --dry-run --cores 1
      - name: Parse complete study and sensitivity workflow
        run: snakemake complete_study --dry-run --cores 1
